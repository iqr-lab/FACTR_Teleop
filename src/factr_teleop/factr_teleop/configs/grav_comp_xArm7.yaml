name: right

dynamixel:
  # USB port name given by the command: ls /dev/serial/by-id/
  dynamixel_port: "usb-FTDI_USB__-__Serial_Converter_FTAKRKXH-if00-port0"
  # Servo types
  servo_types: [
    "XC330_T288_T", "XM430_W210_T", "XC330_T288_T", "XM430_W210_T",
    "XC330_T288_T", "XC330_T288_T", "XC330_T288_T", "XC330_T288_T",
  ]
  # Servo joint directions to match that of the leader arm
  joint_signs: [-1, 1, -1, 1, 1, 1, -1, 1]

arm_teleop:
  # URDF used for creating leader arm dynamics model to compute gravity compensation
  leader_urdf: "xArm7.urdf"
  num_arm_joints: 7
  #arm_joint_limits_max: [2.8973, 1.7628, 2.8973, 2.356, 2.8973, 3.14, 2.8973]
  arm_joint_limits_max: [6.28, 2.09, 6.28, 3.93, 6.28, 3.14, 6.28]
  arm_joint_limits_min: [-6.28, -2.09, -6.28, -3.93, -6.28, -1.69, -6.28]
  #arm_joint_limits_min: [-2.8973, -1.7628, -2.8973, -3.141, -2.356, -1.69, -2.8973]
  arm_joint_limits_safety_margin: 0.1

  initialization:
    # The expected leader arm joint position before launching the script
    calibration_joint_pos: [0.0, -0.6021, 0.0, 0.2618, 0.0, 0.8727, 0.0]
    # The leader arm must be brought to this joint position before the follower starts mirroring the leader
    initial_match_joint_pos: [0.0, -0.6021, 0.0, 0.2618, 0.0, 0.8727, 0.0]

gripper_teleop:
  # The maximum range (in rad) of the leader gripper trigger
  actuation_range: 0.8

controller:
  frequency: 500
  torque_feedback:
    enable: False
    gain: 3.0
    damping: 0.0
    motor_scalar: 94.5652173913
  gravity_comp:
    enable: True
    gain: 0.85
  null_space_regulation:
    null_space_joint_target: [0.0, -0.7854, 0.0, -2.356, 0.0, 1.57, 0.0]
    enable: False
    kp: 0.0
    kd: 0.00
  static_friction_comp:
    enable_speed: 0.9
    gain: 0.1
  joint_limit_barrier:
    kp: 0.3 
    kd: 0.1 
  joint_position_control:
    interpolation_step_size: 0.01
    kp: 0.3 
    kd: 0.1 

  gripper_feedback:
    enable: False
    gain: 0.2
    ema_beta: 0.95


